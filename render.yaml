# Render-konfiguration (https://render.com) – gratisnivån.
# OBS: på gratisnivån är disken tillfällig, så stämplar kan försvinna vid omstart.
services:
  - type: web
    name: slapandtalk
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Flerspelare (WebSocket på /ws, samma port): hur många som syns i ett rum samtidigt.
      - key: MAX_PLAYERS_PER_ROOM
        value: "10"
      # Fullversionen (tyger, Sound settings): hemliga nycklar, se README "Fullversionen".
      # Sätts i Render-panelen (sync: false = värdet ligger inte i repot).
      - key: FULL_ACCESS_KEYS
        sync: false
