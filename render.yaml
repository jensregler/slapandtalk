# Render-konfiguration (https://render.com) – gratisnivån.
# OBS: på gratisnivån är disken tillfällig, så stämplar kan försvinna vid omstart.
services:
  - type: web
    name: slapandtalk
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Flerspelare (WebSocket på /ws, samma port): hur många som syns i ett rum samtidigt.
      - key: MAX_PLAYERS_PER_ROOM
        value: "10"
      # Fullversionen (tyger, Sound settings): hemliga nycklar, se README "Fullversionen".
      # Sätts i Render-panelen (sync: false = värdet ligger inte i repot).
      - key: FULL_ACCESS_KEYS
        sync: false
      # Färdiga videor (README "Färdiga videor"): hur länge de sparas, och e-post med länken.
      - key: VIDEO_RETENTION_DAYS
        value: "30"
      # Sajtens adress i videolänkar och mejl, t.ex. https://slapandtalk.com (tomt = adressen i förfrågan).
      - key: PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Betald fullversion via Lemon Squeezy, se README "Betala för fullversionen".
      - key: LS_STORE_ID
        sync: false
      - key: LS_PRODUCT_ID
        sync: false
      - key: LS_CHECKOUT_URL
        sync: false
      - key: LS_WEBHOOK_SECRET
        sync: false
